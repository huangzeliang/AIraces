{# 移动端抽屉导航：≤700px 侧栏隐藏时提供同等的页面入口（复用 ns 导航数据）。 #}
<div class="mobile-nav" id="mobile-nav" hidden>
  <div class="mobile-nav-mask" data-nav-close></div>
  <aside class="mobile-nav-panel" id="mobile-nav-panel" role="dialog" aria-modal="true" aria-label="导航菜单">
    <div class="mobile-nav-head">
      <a class="brand" href="{{ url_for('ns_workbench') }}"><span class="brand-mark">N</span><span><strong>Northstar</strong><small>目标闭环</small></span></a>
      <button class="mobile-nav-close" id="mobile-nav-close" type="button" aria-label="关闭导航菜单">×</button>
    </div>
    {% include 'ns/components/nav_menu.html' %}
    <div class="sidebar-spacer"></div>
    <div class="profile"><span class="profile-avatar">{{ ns_user.display_name[0] }}</span><span><strong>{{ ns_user.display_name }}</strong><small>{{ ns_position_label }} · {{ ns_org_name }}</small></span></div>
    <form method="post" action="{{ url_for('ns_logout') }}"><button class="button nav-logout" type="submit"><span aria-hidden="true">⏻</span>退出登录</button></form>
  </aside>
</div>
