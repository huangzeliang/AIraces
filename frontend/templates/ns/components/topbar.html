<header class="topbar"><div class="topbar-left"><button class="menu-button" id="mobile-menu-button" type="button" aria-label="打开导航菜单" aria-expanded="false" aria-controls="mobile-nav"><span aria-hidden="true">☰</span></button><div class="breadcrumbs"><span class="crumb-root">目标闭环 <span aria-hidden="true">/</span> </span><strong>{{ ns_page_title }}</strong></div></div><div class="top-actions"><button class="theme-toggle" id="theme-toggle" type="button" aria-pressed="false" aria-label="切换到夜晚模式"><span class="theme-sun" aria-hidden="true">☀</span><span class="theme-moon" aria-hidden="true">☾</span><span class="theme-label">白天</span></button><a class="icon-button" href="{{ url_for('ns_warning') }}" aria-label="预警与提醒（{{ ns_unread }} 条未读）" title="预警与提醒">♢{% if ns_unread %}<em class="reminder-count" id="reminder-badge">{{ ns_unread }}</em>{% endif %}</a><span class="top-avatar" title="{{ ns_user.display_name }}">{{ ns_user.display_name[0] }}</span><form class="logout-form" method="post" action="{{ url_for('ns_logout') }}"><button class="logout-button" type="submit"><span aria-hidden="true">⏻</span>退出</button></form></div></header>
